###############################################################################
# CI/CD für microRealEstate – build → scan → sign → push → deploy
#
# Auslöser: Git-Tag  vX.Y.Z  (immutables Semver-Tag = der Pin)
#
# Benötigte Environment-Secrets im Environment "Deploy"
# (Settings → Environments → Deploy → Secrets):
#   TS_OAUTH_CLIENT_ID     – Tailscale OAuth-Client-ID (Scope: devices, Tag: tag:ci)
#   TS_OAUTH_SECRET        – zugehöriges Secret
#   DEPLOY_SSH_KEY         – privater Deploy-Key (Public-Key liegt beim Deploy-User
#                            in ~/.ssh/authorized_keys, per forced command auf
#                            deployment/deploy.sh beschränkt)
#   DEPLOY_SSH_HOST_KEY    – known_hosts-Zeile des Servers (Host-Key-Pinning)
#
# Optionale Repository-Variables (Settings → Variables):
#   DEPLOY_HOST            – Tailscale-MagicDNS-Name (Default: thinkcentre)
#   DEPLOY_USER            – SSH-User auf dem Server  (Default: jp)
#
# Einrichtung des Servers: siehe deployment/README.md
###############################################################################
name: build-and-deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }} # -> ghcr.io/<owner>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push in GHCR
      id-token: write # cosign keyless (OIDC)
    strategy:
      matrix:
        # name = Image-/Compose-Servicename ; dockerfile = Pfad im Monorepo
        include:
          - { name: gateway, dockerfile: services/gateway/Dockerfile }
          - {
              name: authenticator,
              dockerfile: services/authenticator/Dockerfile
            }
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: tenantapi, dockerfile: services/tenantapi/Dockerfile }
          - { name: banking, dockerfile: services/banking/Dockerfile }
          - { name: pdfgenerator, dockerfile: services/pdfgenerator/Dockerfile }
          - { name: emailer, dockerfile: services/emailer/Dockerfile }
          - { name: landlord-frontend, dockerfile: webapps/landlord/Dockerfile }
          - { name: tenant-frontend, dockerfile: webapps/tenant/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 – Zielserver ist x86_64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: . # Monorepo: Root als Context (Dockerfiles COPYen aus services/ + webapps/)
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest

      - name: Trivy-Scan (Abbruch bei HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: cosign install
        uses: sigstore/cosign-installer@v3

      - name: Sign (keyless / OIDC)
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Muss dasselbe Environment wie der build-Job sein, sonst sind die
    # Environment-Secrets in diesem Job leer und ssh scheitert mit
    # "can't connect without a private SSH key or password".
    environment: Deploy
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Tailscale (ephemerer Node, tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH-Key und known_hosts vorbereiten
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY ist leer. Im Environment 'Deploy' hinterlegen (Settings → Environments → Deploy → Secrets)."
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_HOST_KEY}" ]; then
            echo "::error::Secret DEPLOY_SSH_HOST_KEY ist leer. Host-Key des Servers hinterlegen: ssh-keyscan -t ed25519 <host> (siehe deployment/README.md)."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Formatfehler (fehlender Zeilenumbruch, falsch kopierter Key) sofort melden
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null

          printf '%s\n' "${DEPLOY_SSH_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deployment auslösen (forced command am Server ruft deploy.sh)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'thinkcentre' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'jp' }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -T "${DEPLOY_USER}@${DEPLOY_HOST}" "${TAG}"
